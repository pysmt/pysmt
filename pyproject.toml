[project]
name = "pysmt"
version = "0.11.0.dev0"
description = "A solver-agnostic library for SMT Formulae manipulation and solving"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "PySMT Team" }]
urls = { "Homepage" = "https://github.com/pysmt/pysmt", "Documentation" = "https://pysmt.readthedocs.io" }
# pysmt.cmd.installers.base imports setuptools at runtime (removed in #867)
dependencies = ["setuptools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
pysmt-install = "pysmt.cmd.install:main"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "types-setuptools",
    "ruff==0.17.0",
    "pre-commit==4.6.2",
]
docs = ["sphinx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pysmt"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs/*.rst", "/README.rst", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow, typically these are tests that take more than 10 seconds to run (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line-too-long: handled by the formatter; the rest are unsplittable
    "F403",  # star imports are deliberate in tests and examples
    "F405",  # names from star imports, see F403
]

[tool.ruff.format]

[tool.mypy]
files = ["src/pysmt", "tests"]

[tool.coverage.run]
omit = ["src/pysmt/cmd/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "main()",
]
