[project]
name = "pysmt"
version = "0.11.0.dev0"
description = "A solver-agnostic library for SMT Formulae manipulation and solving"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "PySMT Team" }]
urls = { "Homepage" = "https://github.com/pysmt/pysmt", "Documentation" = "https://pysmt.readthedocs.io" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
pysmt-install = "pysmt.cmd.install:main"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff==0.17.0",
    # filelock, which pre-commit needs, has no security fix for Python 3.10
    "pre-commit==4.6.2; python_version >= '3.11'",
]
docs = ["sphinx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pysmt"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs/*.rst", "/README.rst", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow, typically these are tests that take more than 10 seconds to run (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line-too-long: handled by the formatter; the rest are unsplittable
    "F403",  # star imports are deliberate in tests and examples
    "F405",  # names from star imports, see F403
    "E731",  # lambda-assignment: the small inline lambdas here read fine
    "E741",  # ambiguous-variable-name: `l` is used throughout for logics and lists
]

[tool.ruff.lint.per-file-ignores]
# Tutorials introduce each import next to the code that first uses it.
"examples/*" = ["E402"]
# O is the LTL "once" operator.
"examples/ltl.py" = ["E743"]
# Deprecation warnings are enabled before the remaining pysmt modules are imported.
"src/pysmt/shortcuts.py" = ["E402"]
# The pysmt imports follow the z3 availability check and its global settings.
"src/pysmt/solvers/z3.py" = ["E402"]

[tool.ruff.format]

[tool.mypy]
files = ["src/pysmt", "tests"]

[tool.coverage.run]
omit = ["src/pysmt/cmd/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "main()",
]
