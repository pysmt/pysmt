name: bump-solvers

# Dependabot cannot see the solver pins of pysmt-install, since they are in
# src/pysmt/cmd/install.py and not in a manifest file.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      # PRs opened with the default GITHUB_TOKEN would not trigger CI-on-PR
      - name: Generate a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Bump the solver pins
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          uv sync --locked
          uv run python ci/bump_solvers.py | tee "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the bump pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet src/pysmt/cmd/install.py; then
            echo "No PyPI-backed pin to bump; nothing to do."
            exit 0
          fi

          title="Bump pysmt-install solver pins"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          git checkout -B deps/solvers
          git commit -m "$title" src/pysmt/cmd/install.py
          git push --force origin deps/solvers

          # The branch is force-updated above, so refresh the body too
          if gh pr view deps/solvers --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit deps/solvers --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Pull request for deps/solvers is already open; updated in place."
            exit 0
          fi

          gh pr create \
            --base master \
            --head deps/solvers \
            --title "$title" \
            --body-file "$RUNNER_TEMP/pr-body.md"
