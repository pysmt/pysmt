name: test

on:
  workflow_call:
    inputs:
      os:
        description: Runner image
        type: string
        default: ubuntu-latest
      python-version:
        type: string
        default: "3.14"
      solver:
        description: Argument of just install-solver (a solver, all, none, z3_wrap or msat_wrap)
        type: string
        default: none
      gmpy:
        description: Install gmpy2 and use it for numbers (PYSMT_GMPY)
        type: boolean
        default: false
      cython:
        description: Install Cython and use the compiled SMT-LIB parser (PYSMT_CYTHON)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.os }}, Python ${{ inputs.python-version }}, ${{ inputs.solver }}${{ inputs.gmpy && ', gmpy' || '' }}${{ inputs.cython && ', cython' || '' }}
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        # Git Bash on Windows
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          # install.py pins the solvers that pysmt-install builds or downloads
          cache-dependency-glob: |
            uv.lock
            src/pysmt/cmd/install.py
          cache-suffix: ${{ inputs.solver }}

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.51.0"

      - name: Cache the solver downloads
        uses: actions/cache@v6
        with:
          path: ~/.smt_solvers
          key: smt-solvers-${{ runner.os }}-${{ inputs.solver }}-${{ hashFiles('src/pysmt/cmd/install.py') }}

      # The (Opti)MathSAT bindings need the gmp headers, PicoSAT needs swig
      - name: Install OS packages (Linux)
        if: runner.os == 'Linux' && contains(fromJSON('["msat", "optimsat", "msat_wrap", "picosat", "all"]'), inputs.solver)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev swig

      - name: Install OS packages (macOS)
        if: runner.os == 'macOS' && contains(fromJSON('["msat", "optimsat", "msat_wrap", "all"]'), inputs.solver)
        run: |
          brew install gmp
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix)/include" >> "$GITHUB_ENV"

      - name: Sync environment
        run: uv sync --locked

      - name: Install gmpy2
        if: inputs.gmpy
        run: uv pip install gmpy2

      # pyximport imports distutils, which only setuptools provides on Python 3.12+
      - name: Install Cython
        if: inputs.cython
        run: uv pip install cython setuptools

      - name: Install the solver
        env:
          SOLVER: ${{ inputs.solver }}
        run: just install-solver "$SOLVER"

      - name: Run the test suite
        env:
          PYSMT_SOLVER: ${{ inputs.solver }}
          PYSMT_GMPY: ${{ inputs.gmpy && 'TRUE' || 'FALSE' }}
          PYSMT_CYTHON: ${{ inputs.cython && 'TRUE' || 'FALSE' }}
        run: just test-all -v

      - name: Run the examples
        if: inputs.solver == 'all'
        run: |
          # examples/generic_smtlib.py runs the MathSAT binary from /tmp
          cp tests/smtlib/bin/mathsat /tmp/mathsat
          for ex in examples/*.py; do
            echo "::group::$ex"
            uv run python "$ex"
            echo "::endgroup::"
          done
