name: build-and-release

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-pr.yml

  build:
    needs: [ci]
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # stamp_dev_version.py counts all the commits
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # No cache in the job that builds what we publish
          enable-cache: false

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.51.0"

      - name: Stamp dev version (master only)
        if: github.ref == 'refs/heads/master'
        run: python3 ci/stamp_dev_version.py

      # master publishes only .devN builds, so only the tag uploads a release
      - name: Check the version
        id: version
        run: |
          version=$(uv version --short)
          echo "Version: $version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$version" == *.dev* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist + wheel
        run: just build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  publish:
    needs: [build]
    if: github.repository == 'pysmt/pysmt' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
